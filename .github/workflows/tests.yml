# The unit tests. The expensive job, so it is the one kept on a leash.
#
# Written while the repository was private and every minute was billed
# against the account's free allowance; public now, it runs free, and a
# run still takes a runner and a wait, so this runs when it can actually
# tell us something and stays quiet otherwise:
#
#   * only when something that affects the build has changed -- a
#     screenshot or a paragraph of documentation cannot break a test;
#   * once per change, not twice: pushes are watched only on `main`, and
#     work on a branch is covered by its pull request instead (a branch
#     with an open PR would otherwise run everything twice, on the push
#     AND on the PR);
#   * a new push to the same branch cancels the run still going for the
#     old one, which is a wasted run by definition;
#   * and with a timeout, because the default is SIX HOURS. One hung job
#     would eat a fifth of the month's allowance on its own.
name: tests

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "tools/check_test_results.py"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "tools/check_test_results.py"
      - ".github/workflows/tests.yml"
  # So it can still be run by hand from the Actions tab when wanted.
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The token GitHub gives each run may read the code and nothing more:
# nothing here pushes, comments or publishes; the results are kept by the
# artifact store, which needs none of its rights.
permissions:
  contents: read

jobs:
  unit:
    name: Unit tests on the JVM
    runs-on: ubuntu-latest     # Windows costs 2x a minute, macOS 10x
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      # The SDK the runner ships with may not have the platform this
      # project compiles against; this accepts the licences so AGP can
      # fetch what it needs.
      #
      # packages: '' is not an optimisation. Left at its default the
      # action asks sdkmanager for `tools` -- the obsolete SDK Tools
      # package, which Google has removed from the repository -- and the
      # whole step dies on "Failed to find package 'tools'". Every step
      # after it is then skipped, including the tests. We do not use that
      # package; the platform itself is downloaded by the build.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''

      # Caches Gradle itself and the dependencies, so the runs after the
      # first are minutes shorter -- the cheapest saving available.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - run: chmod +x gradlew

      - name: Run the suites
        run: ./gradlew testDebugUnitTest --no-daemon

      # The task prints nothing useful when it fails and nothing at all
      # when the tests never ran. The XML is the only proof, so it is
      # read even when the step above has already failed.
      - name: Prove the tests ran
        if: always()
        run: python3 tools/check_test_results.py

      - name: Keep the results, so a failure can be read
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
